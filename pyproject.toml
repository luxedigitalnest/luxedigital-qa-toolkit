[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luxedigital-qa-toolkit"
version = "1.1.0"
description = "Local-first QA tools for digital-product delivery packages."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LuxeDigitalNest"}]
keywords = ["etsy", "digital-products", "qa", "quality-assurance", "pdf", "svg", "png", "zip", "seller-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "Pillow>=10.0",
  "pypdf>=5.0",
  "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/luxedigitalnest/luxedigital-qa-toolkit"
Repository = "https://github.com/luxedigitalnest/luxedigital-qa-toolkit"
Issues = "https://github.com/luxedigitalnest/luxedigital-qa-toolkit/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0"]

[project.scripts]
ldqa = "luxedigital_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
